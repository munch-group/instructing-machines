<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="430" fill="#f6f4ef"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">Where the guessing skill comes from: training</text>
  <text x="40" y="63" font-size="14" fill="#5a6675">Before you ever use it, the model plays "fill in the blank" over an enormous amount of text — and slowly tunes millions of dials.</text>

  <!-- TRAINING (once, expensive) -->
  <rect x="40" y="84" width="800" height="212" rx="14" fill="#ffffff" stroke="#d6c6ee"/>
  <rect x="40" y="84" width="6" height="212" rx="3" fill="#6b46a6"/>
  <rect x="64" y="100" width="230" height="22" rx="11" fill="#f1ebf8"/>
  <text x="76" y="115" font-size="11" font-weight="700" fill="#6b46a6" letter-spacing="0.5">TRAINING — DONE ONCE, VERY EXPENSIVE</text>

  <!-- step 1: text -->
  <rect x="66" y="140" width="150" height="128" rx="10" fill="#fbf1e2" stroke="#e9cfa5"/>
  <text x="141" y="162" font-size="12" font-weight="700" fill="#b26a1f" text-anchor="middle">📚 mountains</text>
  <text x="141" y="179" font-size="12" font-weight="700" fill="#b26a1f" text-anchor="middle">of text</text>
  <text x="141" y="206" font-size="11.5" fill="#5a6675" text-anchor="middle">books, websites,</text>
  <text x="141" y="222" font-size="11.5" fill="#5a6675" text-anchor="middle">code, articles —</text>
  <text x="141" y="238" font-size="11.5" fill="#5a6675" text-anchor="middle">much of the</text>
  <text x="141" y="254" font-size="11.5" fill="#5a6675" text-anchor="middle">public internet</text>

  <text x="228" y="208" font-size="20" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- step 2: hide + guess -->
  <rect x="248" y="140" width="200" height="128" rx="10" fill="#e8f1fb" stroke="#bcd6f0"/>
  <text x="348" y="162" font-size="12" font-weight="700" fill="#2f6db3" text-anchor="middle">hide the next word,</text>
  <text x="348" y="178" font-size="12" font-weight="700" fill="#2f6db3" text-anchor="middle">let the model guess</text>
  <text x="266" y="206" font-size="12" fill="#26313f" font-family="monospace">"…a gene is made</text>
  <text x="266" y="224" font-size="12" fill="#26313f" font-family="monospace">of ▢▢▢"</text>
  <text x="266" y="250" font-size="11.5" fill="#5a6675">guess: <tspan fill="#2f6db3" font-weight="700">DNA</tspan> · real: <tspan fill="#1f7a68" font-weight="700">DNA ✓</tspan></text>

  <text x="460" y="208" font-size="20" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- step 3: nudge dials -->
  <rect x="480" y="140" width="336" height="128" rx="10" fill="#eceef1" stroke="#cfd4db"/>
  <text x="648" y="162" font-size="12" font-weight="700" fill="#3a4250" text-anchor="middle">nudge the dials so next time the guess is a little better</text>
  <!-- dials -->
  <g>
    <circle cx="540" cy="212" r="18" fill="#ffffff" stroke="#cfd4db"/><line x1="540" y1="212" x2="551" y2="201" stroke="#6b46a6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="595" cy="212" r="18" fill="#ffffff" stroke="#cfd4db"/><line x1="595" y1="212" x2="586" y2="200" stroke="#6b46a6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="650" cy="212" r="18" fill="#ffffff" stroke="#cfd4db"/><line x1="650" y1="212" x2="662" y2="216" stroke="#6b46a6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="705" cy="212" r="18" fill="#ffffff" stroke="#cfd4db"/><line x1="705" y1="212" x2="697" y2="224" stroke="#6b46a6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="760" y="208" font-size="13" fill="#3a4250" font-weight="700">…millions</text>
    <text x="760" y="225" font-size="13" fill="#3a4250" font-weight="700">of them</text>
  </g>
  <text x="648" y="256" font-size="11.5" fill="#5a6675" text-anchor="middle">these dials are the "weights" — the whole of what the model knows</text>

  <text x="440" y="288" font-size="12.5" fill="#6b46a6" text-anchor="middle" font-style="italic">↺ repeat billions of times</text>

  <!-- arrow down to frozen model -->
  <text x="440" y="322" font-size="20" fill="#b9b1a3" text-anchor="middle">↓ the finished, frozen result</text>

  <!-- USING IT -->
  <rect x="40" y="336" width="800" height="72" rx="14" fill="#f1ebf8" stroke="#d6c6ee"/>
  <text x="64" y="362" font-size="15" font-weight="700" fill="#6b46a6">🤖 The trained model — the dials are now fixed</text>
  <text x="64" y="386" font-size="13" fill="#5a6675">When you chat with it, it does <tspan font-weight="600" fill="#26313f">not</tspan> learn or look anything up. It just runs the next-word guess with those frozen dials. Same skill, no new knowledge mid-conversation.</text>
</svg>
