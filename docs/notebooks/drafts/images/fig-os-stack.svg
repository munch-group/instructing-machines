<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="430" fill="#f6f4ef"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#26313f">The operating system sits in the middle</text>
  <text x="40" y="66" font-size="14" fill="#5a6675">macOS, Windows and Linux are all operating systems: the manager that lets your programs use the hardware without fighting over it.</text>

  <!-- YOU -->
  <g>
    <rect x="250" y="92" width="380" height="52" rx="12" fill="#f1ebf8" stroke="#d6c6ee"/>
    <text x="440" y="118" font-size="15" font-weight="700" fill="#6b46a6" text-anchor="middle">👤 You</text>
    <text x="440" y="136" font-size="12.5" fill="#7a5aa8" text-anchor="middle">click, type, launch things</text>
  </g>
  <text x="440" y="162" font-size="20" fill="#b9b1a3" text-anchor="middle">↓</text>

  <!-- APPS -->
  <g>
    <rect x="130" y="170" width="620" height="66" rx="12" fill="#ffffff" stroke="#b6ddd2"/>
    <rect x="130" y="170" width="6" height="66" rx="3" fill="#1f7a68"/>
    <text x="152" y="194" font-size="11" font-weight="700" fill="#1f7a68" letter-spacing="0.5">YOUR PROGRAMS (SOFTWARE)</text>
    <text x="152" y="220" font-size="14" fill="#26313f">the browser · VS&#160;Code · the terminal · Python running <tspan font-family="monospace" font-size="12.5">hello.py</tspan></text>
  </g>
  <text x="440" y="256" font-size="20" fill="#b9b1a3" text-anchor="middle">↓ ask for a file, a window, some memory ↓</text>

  <!-- OS -->
  <g>
    <rect x="90" y="270" width="700" height="72" rx="12" fill="#eceef1" stroke="#cfd4db"/>
    <rect x="90" y="270" width="6" height="72" rx="3" fill="#3a4250"/>
    <text x="112" y="296" font-size="11" font-weight="700" fill="#3a4250" letter-spacing="0.5">THE OPERATING SYSTEM — THE MANAGER</text>
    <text x="112" y="322" font-size="14" fill="#26313f">hands out memory · finds files on the disk · shares the CPU between programs · draws windows · talks to the keyboard, screen, network</text>
  </g>
  <text x="440" y="362" font-size="20" fill="#b9b1a3" text-anchor="middle">↓ drive the actual electronics ↓</text>

  <!-- HARDWARE -->
  <g>
    <rect x="130" y="376" width="620" height="40" rx="12" fill="#fbf7ef" stroke="#e9cfa5"/>
    <text x="440" y="401" font-size="13.5" font-weight="600" fill="#26313f" text-anchor="middle">⚙️ CPU&#160;&#160;·&#160;&#160;🧠 memory&#160;&#160;·&#160;&#160;💾 disk&#160;&#160;·&#160;&#160;⌨️ keyboard&#160;&#160;·&#160;&#160;🖥️ screen — the hardware</text>
  </g>
</svg>
