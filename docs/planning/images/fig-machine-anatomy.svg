<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="420" fill="#f6f4ef"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#26313f">The three parts that do the work</text>
  <text x="40" y="66" font-size="14" fill="#5a6675">One idea holds it together: some things are <tspan font-weight="600" fill="#b26a1f">kept</tspan> (survive the power going off) and some are <tspan font-weight="600" fill="#2f6db3">temporary</tspan> (vanish when a program stops).</text>

  <!-- DISK -->
  <g>
    <rect x="40" y="96" width="250" height="260" rx="14" fill="#ffffff" stroke="#e9cfa5"/>
    <rect x="40" y="96" width="6" height="260" rx="3" fill="#b26a1f"/>
    <rect x="64" y="116" width="92" height="22" rx="11" fill="#fbf1e2"/>
    <text x="110" y="131" font-size="11" font-weight="700" fill="#b26a1f" text-anchor="middle" letter-spacing="0.5">PERMANENT</text>
    <text x="66" y="176" font-size="34">💾</text>
    <text x="120" y="170" font-size="19" font-weight="700" fill="#26313f">Hard disk</text>
    <text x="64" y="222" font-size="13.5" fill="#5a6675">Where your files live —</text>
    <text x="64" y="242" font-size="13.5" fill="#5a6675">code, data, everything.</text>
    <text x="64" y="262" font-size="13.5" fill="#5a6675">Stays put when the</text>
    <text x="64" y="282" font-size="13.5" fill="#5a6675">computer is switched off.</text>
    <text x="64" y="316" font-size="13" fill="#b26a1f" font-weight="600">Saving = writing to disk.</text>
    <text x="64" y="340" font-size="12.5" fill="#8a93a0">large · slow · remembers</text>
  </g>

  <!-- arrow load -->
  <text x="316" y="200" font-size="15" fill="#5a6675" text-anchor="middle">loads a</text>
  <text x="316" y="218" font-size="15" fill="#5a6675" text-anchor="middle">copy into</text>
  <text x="316" y="240" font-size="26" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- MEMORY -->
  <g>
    <rect x="344" y="96" width="250" height="260" rx="14" fill="#ffffff" stroke="#bcd6f0"/>
    <rect x="344" y="96" width="6" height="260" rx="3" fill="#2f6db3"/>
    <rect x="368" y="116" width="92" height="22" rx="11" fill="#e8f1fb"/>
    <text x="414" y="131" font-size="11" font-weight="700" fill="#2f6db3" text-anchor="middle" letter-spacing="0.5">TEMPORARY</text>
    <text x="370" y="176" font-size="34">🧠</text>
    <text x="424" y="170" font-size="19" font-weight="700" fill="#26313f">Memory (RAM)</text>
    <text x="368" y="222" font-size="13.5" fill="#5a6675">Holds whatever is</text>
    <text x="368" y="242" font-size="13.5" fill="#5a6675"><tspan font-style="italic">running right now</tspan> — the</text>
    <text x="368" y="262" font-size="13.5" fill="#5a6675">program and its values.</text>
    <text x="368" y="282" font-size="13.5" fill="#5a6675">Emptied when it stops.</text>
    <text x="368" y="316" font-size="13" fill="#2f6db3" font-weight="600">Nothing here is saved</text>
    <text x="368" y="334" font-size="13" fill="#2f6db3" font-weight="600">unless you write it to disk.</text>
  </g>

  <!-- arrow works -->
  <text x="620" y="200" font-size="15" fill="#5a6675" text-anchor="middle">feeds</text>
  <text x="620" y="222" font-size="26" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- CPU -->
  <g>
    <rect x="648" y="96" width="192" height="260" rx="14" fill="#ffffff" stroke="#cfd4db"/>
    <rect x="648" y="96" width="6" height="260" rx="3" fill="#3a4250"/>
    <rect x="672" y="116" width="80" height="22" rx="11" fill="#eceef1"/>
    <text x="712" y="131" font-size="11" font-weight="700" fill="#3a4250" text-anchor="middle" letter-spacing="0.5">THE WORKER</text>
    <text x="674" y="176" font-size="34">⚙️</text>
    <text x="726" y="170" font-size="19" font-weight="700" fill="#26313f">CPU</text>
    <text x="672" y="222" font-size="13.5" fill="#5a6675">Does the actual</text>
    <text x="672" y="242" font-size="13.5" fill="#5a6675">computing — one small</text>
    <text x="672" y="262" font-size="13.5" fill="#5a6675">step at a time,</text>
    <text x="672" y="282" font-size="13.5" fill="#5a6675">extremely fast.</text>
    <text x="672" y="316" font-size="13" fill="#3a4250" font-weight="600">Only ever works on what</text>
    <text x="672" y="334" font-size="13" fill="#3a4250" font-weight="600">is in memory right now.</text>
  </g>

  <text x="40" y="392" font-size="12.5" fill="#8a93a0" font-style="italic">Instructing Machines · disk keeps · memory forgets · the CPU works on what memory holds</text>
</svg>
