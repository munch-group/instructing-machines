format:
  html:
  # live-html: enables pyodide
    theme: 
      - default
      - custom.scss
    highlight-style: numpy.theme
    fig-width: 5
    fig-height: 3
    filters:
      - filters/unnumber.lua
      - quarto
      - filters/headers.lua
    # Repoints the "TA version" / "Student version" margin link declared in the
    # two profile files at the counterpart of the page being read. Inert on a
    # page that declares neither, so it is shared by both profiles.
    include-after-body: _includes/ta-link.html
    toc-expand: false
    notebook-links: global
    number-sections: true      
    code-block-bg: "#f9f9f9"
#    code-annotations: hover
    code-annotations: below
    df-print: paged     # pandas DataFrames render as a nice paged/sortable HTML table instead of a text repr
    # code-tools: true     # adds a "</> Code" menu in the top-right to show/hide all code and view page source
    code-fold: false     # project-wide default for folding (per-cell/per-notebook can still override)

    repo-url: https://github.com/munch-group/instructing-machines
  
    # other-links:
    #   - text: Slides
