  #   - quarto render --to html --profile draft

  render:
    - "!python/snippet-cast.ipynb"
    - "!slides/"
    - "!_build/"
    - "!jupyterlite/"
    - "!demo/"
    - "AI-opening.qmd"

book:
  title: "Instructing Machines"
  sidebar:
    title: "Home"
    collapse-level: 2
    background: "white" 
    lightbox: true     
    downloads: [pdf, epub]
  chapters:


    # ------------------------------------------------------------------
    # Outstanding work, moved here from docs/planning/checklist.md so that
    # each task sits next to the week and the chapter it lands in.  Collect
    # it all with `python3 tools/prompts.py`, which reads this file as well
    # as the chapters it lists.  Delete an instruction in the same commit
    # that carries it out.
    #
    # CLAUDE:  docs/planning/widgets-in-the-python-notes.md
    #   already maps which widget belongs where; that mapping is unimplemented.
    #   The per-chapter notes below say where each one goes.
    # CLAUDE: confirm that `pixi run get <chapter>` reaches every chapter a
    #   student is asked to download, and that docs/_book/notebooks/index.txt
    #   lists them all after a full render.
    # CLAUDE: verify the Windows install path end to end on a clean Windows
    #   machine — install pixi from the .msi, unpack the course folder, open
    #   VS Code, run a widget. The .msi route is the documented one and nobody
    #   has confirmed the full sequence.
    #
    # CLAUDE: term-readiness review (2026-08-08). Below are the findings that
    #   are book-wide rather than one chapter's; the per-chapter ones sit
    #   under their own lines further down.
    # CLAUDE: the downloadable student zip has no path to the live site. The
    #   post-render hook above that would call scripts/build_student_folder.py
    #   is commented out, and .github/workflows/quarto-publish.yml never calls
    #   it either — only student-env-check.yml does, and only as a CI
    #   artifact, not a site deploy. getting_started.ipynb's first instruction
    #   to students is to download that zip. Wire the build step into the
    #   real publish workflow before term, and confirm a real publish
    #   produces it.
    # CLAUDE: course-design.qmd's Workload section calls week 1 a "breather
    #   week." The Week 1 note below says the opposite — by a wide margin the
    #   heaviest week in the book — and per the rule at the top of this file
    #   this note is the one that's authoritative where they disagree. Fix
    #   course-design.qmd to agree, and do the hour-budget check the Week 1
    #   note already asks for; nothing in the repo shows it has happened yet.
    # ------------------------------------------------------------------
    - index.qmd
    - part: "Week 1"
      # Python: As always.
      # AI: EXPLAINER — introduced by intro/course-introduction.qmd and put to
      #   work in ai/meet-ai.qmd and ai/about-microsoft-copilot.qmd. 11 EXPLAINER
      #   exercises against 105 SOLO.
      # Workload: by a wide margin the heaviest week in the book — 11 chapters,
      #   ~24,400 words, 113 exercises, taught in the week the students know
      #   least. Roughly 11,500 of those words are orientation rather than
      #   Python (insides, instruction, meet-ai, about-microsoft-copilot,
      #   notebooks-in-vscode, script-vs-notebook), so the reading load is what
      #   is extreme, not the practice; much of it could be pre-term or spread
      #   across weeks 1 and 2. Check this against the actual teaching hours
      #   before term, not during it.
      chapters: 
        - intro/course-introduction.qmd
        - python/getting_started.ipynb
          # CLAUDE: four crossrefs don't resolve — two to
          #   @sec-if-something-goes-wrong, one each to @sec-installing-pixi
          #   and @sec-opening-the-folder (confirmed in a full render: four
          #   "Unable to resolve crossref" warnings, all in this chapter and
          #   nowhere else in the book). This book only numbers
          #   #### Exercise headings (see crossref: sec-prefix below);
          #   ordinary ## sections stay unnumbered on purpose, so @sec-x can
          #   never resolve to one here. Change all four to plain links, e.g.
          #   [If something goes wrong](#sec-if-something-goes-wrong).
        - python/hello-world.ipynb
        - intro/notebooks.ipynb
        - ai/meet-ai.qmd
        - python/values-operators-logic.ipynb
        - python/precedence-steps.ipynb
        - ai/insides.md
        - ai/instruction.md
    - part: "Week 2"
      # AI: no new rung. EXPLAINER is consolidated by ai/predict-then-prove.qmd,
      #   which is where "the AI predicts; the machine proves" is stated as a
      #   working rule rather than a slogan. 26 EXPLAINER against 43 SOLO — the
      #   densest EXPLAINER week of the term.
      # Workload: 3 chapters, ~7,200 words, 69 exercises. Light in reading and
      #   heavy in practice, which is the right shape: this is the functions
      #   and scope cliff, and functions.ipynb alone carries 32 exercises.
      chapters: 
        - python/if-else.ipynb
        - python/functions.ipynb
        - ai/predict-then-prove.qmd
    - part: "Week 3"
      # AI: no new rung. ai/how-models-produce-code.qmd adds two more
      #   EXPLAINER moves (translating code to English and back, asking for
      #   more examples of a pattern) on top of the 10 already earned. 14
      #   EXPLAINER against 65 SOLO.
      # Workload: 6 chapters, ~9,400 words, 78 exercises — the second-heaviest
      #   week. The chapters are badly uneven inside it: objects.ipynb is 2,564
      #   words and tuples.ipynb is 643.
      chapters: 
        - ai/how-models-produce-code.qmd
        - python/objects.ipynb
        - python/lists.ipynb
        - python/dictionaries.ipynb
        - python/tuples.ipynb
          # CLAUDE: at 643 words the thinnest chapter in the book that is not a
          #   stub, and flagged in the earlier audit for content rather than
          #   typos. Its hand-typed traceback is also stale — regenerate it
          #   against the pinned interpreter.
        - turtle/week3.qmd
    - part: "Week 4"
      # AI: no new rung. EXPLAINER is sharpened by ai/explain-then-confirm.qmd,
      #   which supplies all 15 of the week's EXPLAINER exercises, against 17
      #   SOLO.
      # Workload: 4 chapters, ~5,300 words, 32 exercises — below the median,
      #   and deliberately so, because week 4 coincides with the iteration
      #   cliff and the lab split. The shape is wrong in one place: see the
      #   note on testing.ipynb.
      chapters: 
        - ai/explain-then-confirm.qmd
        - python/iteration.ipynb
        - python/testing.ipynb
          # CLAUDE: the smallest chapter doing the largest job. At 1392 words
          #   across eight cells — and a good part of that length is now the
          #   list of missing content appended to its end, so the chapter
          #   proper is shorter than the number suggests — it is the designated
          #   hub for the idea that a test is how you verify code you did not
          #   write. Weeks 8 through 13 all lean on it, and it carries zero
          #   badged exercises. It should be the chapter that grows most: frame
          #   tests explicitly as how you verify AI-generated code, and add
          #   exercises that write one failing test and then one passing one.
        - turtle/week4.qmd
          # CLAUDE: the turtle chapters for weeks 4 through 8 use no widget at
          #   all, which is odd given that turtle output is the most visually
          #   checkable thing in the book and therefore the safest place to let
          #   the AI draft. Decide whether that is intentional.
    - part: "Week 5"
      # AI: no new rung. ai/practical-ai-use.qmd. Only 3 EXPLAINER against 38
      #   SOLO, the thinnest AI presence of any week before the projects begin.
      # Workload: 4 chapters, ~6,700 words, 41 exercises — close to the median
      #   week. data_structures.ipynb is the exemplar for exercise density and
      #   authentic voice; files.ipynb is the lightest thing in the week.
      chapters: 
        - ai/practical-ai-use.qmd        
          # CLAUDE: carries a week's AI slot on its own. Was under 700 words,
          #   now near a thousand, and ends with an explicit list of the
          #   content it still needs. Write the list out and delete it.
        # - python/list-comprehensions.ipynb
        - python/data_structures.ipynb
        - python/files.ipynb
        - turtle/week5.qmd
    - part: "Week 6"
      # AI: COMPARER, introduced by ai/ask-for-another-way.qmd. 11 COMPARER
      #   against 7 SOLO: the only week in which AI-licensed exercises
      #   outnumber the solo ones, which is the point of the rung — asking for
      #   a second solution is worthless unless you write several.
      # Workload: 4 chapters, ~5,200 words, 18 exercises. Light on paper, but
      #   the project is the work and its size does not show up in a count of
      #   exercise headings.
      chapters: 
        - ai/ask-for-another-way.qmd
        - projects/translation-project.qmd
          # CLAUDE: this project and hiv-project.qmd (week 10) are the two
          #   "mandatory hand-in" projects in the old course this one is
          #   paced against, but nothing in this repo operationalizes that —
          #   no grading, deadline, or hand-in mechanism exists for either,
          #   here or in project-files/. course-design.qmd already lists this
          #   as "Still open." Decide before week 6, since that's the week it
          #   first matters.
        - python/composition.qmd
        - turtle/week6.qmd
    - part: "Week 7"
      # AI: DRAFTER, introduced by ai/let-it-draft.qmd. 7 DRAFTER, 1 COMPARER
      #   and 4 EXPLAINER against 28 SOLO. This is the first rung where the
      #   student lets the assistant write code they will keep.
      # Workload: 5 chapters, ~9,300 words and 40 exercises on top of a
      #   project — heavy. classes.ipynb alone is 4,464 words, the longest
      #   chapter in the book, and whether it stays at that scope is one of the
      #   open decisions at the top of this file.
      chapters: 
        - ai/let-it-draft.qmd
        - python/classes.ipynb
          # CLAUDE: the defects flagged in the earlier audit are gone — no
          #   truncated codon_table, no undefined TreeNode, no wrong palindrome
          #   example, and there is now an explicit `## Not a "constructor"`
          #   section. What is still open is scope: CLAUDE.md 4.9 recommends
          #   moving the over-scoped half to an appendix. That is a decision,
          #   not a defect.
        - projects/folding-project.qmd
        - python/debugging.qmd
        - turtle/week7.qmd
    - part: "Week 8"
      # Python: no new Python. The alignment project and the turtle chapter
      #   carry the practice while the AI thread does the teaching.
      # AI: no new rung. ai/tests-are-the-contract.md deepens DRAFTER into its
      #   stricter, contract-first form — the assistant stops being a source of
      #   explanations and becomes something you check. ai/reading-and-judging.md
      #   also sits at DRAFTER. 6 DRAFTER against 13 SOLO; 2 exercises carry no
      #   badge, where the point is that no test or draft would have caught the
      #   fault.
      # Workload: 4 chapters, ~9,900 words, 21 exercises. Reading-heavy — the
      #   two AI notes are 4,857 words between them — but there is no new
      #   Python to absorb, so the total is manageable.
      chapters: 
        - ai/reading-and-judging.md
        - ai/tests-are-the-contract.md
        - projects/alignment-project.qmd
        - turtle/week8.qmd
    - part: "Week 9"
      # Python: packages and modules — using code from other files, the modern
      #   "giant's shoulders". new/biopython.ipynb is commented out below.
      # AI: no new rung. ai/the-docs-are-the-test.qmd extends DRAFTER from "a
      #   test settles it" to "the real documentation settles it", which is the
      #   answer to invented library functions.
      # Workload: 4 chapters, ~7,100 words, plus the codon-bias project — but
      #   only 6 badged exercises in the entire week, the sparsest of the term,
      #   and packages-modules.ipynb has 4 of them across 2,689 words. That is
      #   a real gap in practice, not a light week.
      chapters: 
        - ai/the-docs-are-the-test.qmd
          # CLAUDE: carries a week's AI slot on its own. Was under 700 words,
          #   now near a thousand, and ends with an explicit list of the
          #   content it still needs. Write the list out and delete it.
        - projects/codonbias-project.qmd
        - python/packages-modules.ipynb
        - ai/documentation-and-resources.qmd
        # - new/biopython.ipynb
    - part: "Week 10"
      # Python: recursion and decomposition — breaking a problem into parts,
      #   which is the same skill in code that the Collaborator rung asks for
      #   in prose. The pairing is deliberate.
      # AI: COLLABORATOR, introduced by ai/plan-before-you-prompt.md. 3
      #   COLLABORATOR and 16 SOLO.
      # Workload: 4 chapters, ~8,000 words, 20 exercises, plus the HIV project.
      #   recursion.ipynb is 2,771 words and 14 exercises on its own and sits
      #   in a project week — check that against the teaching hours.
      chapters: 
        - ai/plan-before-you-prompt.md
        - projects/hiv-project.qmd
          # CLAUDE: test_hivproject.py reads its five subtype .txt files by
          #   bare relative filename at import time, so pytest (or the
          #   im-pytest widget) must be run with cwd = project-files/hivproject/
          #   or collection crashes outright with FileNotFoundError — every
          #   other project's suite degrades to a clean skip regardless of
          #   invocation directory. Resolve the paths relative to __file__,
          #   or confirm the widget always sets cwd correctly.
        - python/recursion.ipynb
        - python/decomposition.qmd
    - part: "Week 11"
      # AI: DEVELOPER, the top of the ladder, introduced by
      #   ai/delegate-the-full-problem.md with ai/directing-a-resource.qmd
      #   ahead of it. 3 DEVELOPER and 1 COLLABORATOR against 3 SOLO.
      # Workload: 3 chapters, ~5,300 words, 7 exercises, plus a project. Light
      #   in the notes and deliberately so: by week 11 the project is the whole
      #   test of whether the ladder took.
      chapters: 
        - ai/directing-a-resource.qmd
        - ai/delegate-the-full-problem.md
        - projects/seqdist-project.qmd
    - part: "Week 12"
      # AI: no new rung. ai/learning-with-an-ai.qmd turns the ladder back on
      #   the student's own learning. 1 COLLABORATOR, 2 COMPARER and 1 DRAFTER
      #   against 5 SOLO.
      # Workload: 3 chapters, ~6,100 words, 9 exercises, plus the ORF project.
      chapters: 
        - ai/learning-with-an-ai.qmd
        - projects/orf-project.qmd
          # CLAUDE: projects/curration-project.qmd is written but scheduled
          #   nowhere. This is the week it would join, if it joins. Decide
          #   whether it is a second project here or is dropped, and either add
          #   the line or delete the file.
        - python/dataframes.ipynb
    - part: "Week 13"
      # Python: no new Python; the assembly project.
      # AI: no new rung. The finale exercises the whole ladder at once, which
      #   is what it is for. 1 DEVELOPER against 5 SOLO.
      # Workload: 4 chapters, ~6,000 words, 6 exercises, plus the finale and a
      #   project. The word count is misleading — see finale-kickoff.qmd.
      chapters: 
        - ai/finale-kickoff.qmd
          # CLAUDE: 135 words. The finale is the assessment the whole role
          #   ladder builds toward, and its opening chapter is a placeholder.
          #   Done looks like a kickoff that states the task, the deliverable,
          #   the rules about AI involvement, and how the work is judged.
        - ai/finale-build.qmd
        - ai/finale-finishing.qmd
        - projects/assembly-project.qmd
    - part: "Week 14"
      # AI: no new rung; the ladder is put down. ai/surviving-ai.md is the
      #   argument for why any of it mattered. 4 SOLO.
      # Workload: 2 chapters, ~2,800 words, 5 exercises — the lightest week,
      #   which is right for a wrap-up.
      chapters: 
        - ai/surviving-ai.md
        - ai/the-ai-off-test.qmd
    - part: "Cheatsheets"
      # AI: not part of the ladder. 1 DRAFTER and 1 EXPLAINER against 2 SOLO.
      # Workload: reference material; no teaching time attached.
      chapters:
        - intro/widget-reference.ipynb
          # CLAUDE: this chapter tells students to run the print-steps
          #   command, but the script-widget package that provides it is only
          #   in the root pixi.toml, not in student-folder/pixi.toml — the
          #   environment students actually install. Add it there (and to the
          #   "Check the course environment" import list in
          #   .github/workflows/quarto-publish.yml) or the command fails for
          #   every student who tries it.
        - python/widget-demo.ipynb

# bibliography: references.bib

crossref:
  sec-prefix: "exercise"
  
# embed-resources: true

execute:
  echo: true        # show the source code (default: true)
  enabled: false    # never execute at render time. Notebooks are executed and verified
                     #   separately (`pixi run clean-notebooks`, tools/clean_notebooks.py),
                     #   then stripped of output before commit, so the website and the
                     #   download are always the same notebook — the one a student would
                     #   open and run, not one with the answer already sitting in it.
  output: true      # moot while enabled is false; kept so flipping enabled back on for a
                     #   local preview does the right thing without editing this block
  warning: false    # hide Python warnings (default: true)
  error: false      # false = a runtime error stops the render; true = print the traceback and continue
  freeze: auto      # also moot while enabled is false; same reasoning as output above

# comments:
#   hypothesis: true

link-external-newwindow: true

margin-header: |
  {{< notebook-download label="Download notebook" type="light" >}}
# margin-footer: |
#   - [FAQ]()
#   - [Where am I]()
#   - [Cheat sheet]()

format:
  html:
    # mainfont: "Passata"
    theme: 
      - default
      - custom.scss
    # highlight-style: kate 
    highlight-style: numpy.theme
    fig-width: 5
    fig-height: 3
    filters:
      - unnumber.lua
      - quarto
      - headers.lua
    toc-expand: false
    notebook-links: global
    # number-sections: false
    number-sections: true      
    code-block-bg: "#f9f9f9"
    code-annotations: hover
    df-print: paged     # pandas DataFrames render as a nice paged/sortable HTML table instead of a text repr
    # code-tools: true     # adds a "</> Code" menu in the top-right to show/hide all code and view page source
    code-fold: false     # project-wide default for folding (per-cell/per-notebook can still override)

  ipynb: default

