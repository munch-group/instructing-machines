        - ai-arc/explain-then-confirm.qmd
        - ai-arc/practical-ai-use.qmd
        - ai-arc/how-models-produce-code.qmd
        - ai-arc/tests-are-the-contract.md
        - ai-arc/reading-and-judging.md
        - ai-arc/plan-before-you-prompt.md
        - ai-arc/the-docs-are-the-test.qmd
        - ai-arc/delegate-the-full-problem.md
        - ai-arc/let-it-draft.qmd
