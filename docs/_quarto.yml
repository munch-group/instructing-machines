project:
  type: book
  output-dir: _book
  # post-render:
  #   - python3 ../scripts/build_student_folder.py
  #   - quarto render slides/
  #   - rm -rf _book/_build/slides
  #   - mkdir -p _book/_build
  #   - mv slides/_build _book/_build/slides
  #   - scripts/build-demo.sh
  
