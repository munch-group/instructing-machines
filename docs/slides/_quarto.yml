
format:
  revealjs:
    smaller: true
    theme: [default, ../custom.scss, slides.scss]     
    # theme: [default, ../custom.scss]     
    mainfont: "Helvetica"
    html-math-method: mathjax
    # code-block-bg: "#f9f9f9"
    code-block-bg: "#ffffff"
    code-annotations: hover
    # section-divs: true
    include-in-header:
      - text: <link rel="stylesheet" href="libs/bootstrap-icons/bootstrap-icons.css">
    # include-in-header:
    # - text: |
    #     <script>
    #       Reveal.initialize({ plugins: [RevealMath.MathJax3] });
    #     </script>

execute:
  freeze: auto
  echo: false
  fig-format: svg


project:
