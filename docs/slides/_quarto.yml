
format:
  revealjs:
    smaller: true
    theme: [default, ../custom.scss, slides.scss]     
    # theme: [default, ../custom.scss]     
    mainfont: "Helvetica"
    html-math-method: mathjax
    # code-block-bg: "#f9f9f9"
    code-block-bg: "#ffffff"
    code-annotations: hover
    # section-divs: true
    include-in-header:
      # Bootstrap Icons are used by _pdf-howto.qmd (bi-list, bi-gear). Quarto
      # bundles them for the book format but not for revealjs, so they are
      # vendored here. Not under libs/, which .gitignore treats as build
      # output -- that is why this link 404ed: the files could never be
      # committed, so no clone or CI build ever had them.
      - text: <link rel="stylesheet" href="assets/bootstrap-icons/bootstrap-icons.css">
    # include-in-header:
    # - text: |
    #     <script>
    #       Reveal.initialize({ plugins: [RevealMath.MathJax3] });
    #     </script>

execute:
  freeze: auto
  echo: false
  fig-format: svg


project:
  output-dir: _build
  resources:
    - assets/bootstrap-icons/**
  render:
