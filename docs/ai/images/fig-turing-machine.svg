<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="880" height="420" fill="#f6f4ef"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">The simplest machine that can compute anything</text>
<text x="40" y="63" font-size="14" fill="#5a6675">Alan Turing imagined it in 1936: a paper tape, a head that reads and writes one square, a state, and a table of rules.</text>
<rect x="40" y="88" width="400" height="150" rx="12" fill="#ffffff" stroke="#b6ddd2"/>
<rect x="40" y="88" width="6" height="150" rx="3" fill="#1f7a68"/>
<text x="64" y="112" font-size="12" font-weight="700" fill="#1f7a68" letter-spacing="0.5">THE RULES — THE "PROGRAM"</text>
<text x="64" y="140" font-size="13" fill="#26313f">if state A reads <tspan font-family="monospace" font-weight="700" fill="#2f6db3">0</tspan> → write <tspan font-family="monospace" font-weight="700" fill="#2f6db3">1</tspan>, move →, stay A</text>
<text x="64" y="170" font-size="13" fill="#26313f">if state A reads <tspan font-family="monospace" font-weight="700" fill="#2f6db3">1</tspan> → write <tspan font-family="monospace" font-weight="700" fill="#2f6db3">0</tspan>, move →, go B</text>
<text x="64" y="200" font-size="13" fill="#26313f">if state B reads <tspan font-family="monospace" font-weight="700" fill="#2f6db3">1</tspan> → write <tspan font-family="monospace" font-weight="700" fill="#2f6db3">1</tspan>, move ←, STOP</text>
<text x="64" y="226" font-size="11.5" fill="#5a6675" font-style="italic">the machine never changes these — they are the whole task</text>
<rect x="470" y="88" width="180" height="66" rx="12" fill="#eceef1" stroke="#cfd4db"/>
<text x="560" y="112" font-size="12" font-weight="700" fill="#3a4250" text-anchor="middle" letter-spacing="0.5">STATE RIGHT NOW</text>
<text x="560" y="140" font-size="22" font-weight="700" fill="#3a4250" text-anchor="middle">A</text>
<rect x="470" y="166" width="370" height="72" rx="12" fill="#ffffff" stroke="#cfd4db"/>
<rect x="470" y="166" width="6" height="72" rx="3" fill="#3a4250"/>
<text x="494" y="190" font-size="12" font-weight="700" fill="#3a4250" letter-spacing="0.4">EACH STEP, THE HEAD:</text>
<text x="494" y="214" font-size="13.5" fill="#26313f">reads the square → looks up the rule → writes →</text>
<text x="494" y="232" font-size="13.5" fill="#26313f">moves one step → changes state → <tspan font-weight="700" fill="#3a4250">↺ repeat</tspan></text>
<text x="233" y="266" font-size="12" font-weight="700" fill="#2f6db3" letter-spacing="0.5">THE TAPE — squares of symbols, running on forever both ways</text>
<rect x="365" y="274" width="150" height="26" rx="7" fill="#3a4250"/>
<text x="440" y="292" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">▼ THE HEAD</text>
<line x1="440" y1="300" x2="440" y2="304" stroke="#3a4250" stroke-width="2"/>
<rect x="233" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<rect x="279" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="302" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">1</text>
<rect x="325" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="348" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">0</text>
<rect x="371" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="394" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">1</text>
<rect x="417" y="304" width="46" height="52" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2.5"/>
<text x="440" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">0</text>
<rect x="463" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="486" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">1</text>
<rect x="509" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="532" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">1</text>
<rect x="555" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="578" y="339" font-size="22" font-family="monospace" font-weight="700" fill="#26313f" text-anchor="middle">0</text>
<rect x="601" y="304" width="46" height="52" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
<text x="215" y="339" font-size="20" fill="#b9b1a3" text-anchor="middle">…</text>
<text x="665" y="339" font-size="20" fill="#b9b1a3" text-anchor="middle">…</text>
<text x="40" y="400" font-size="12.5" fill="#8a93a0" font-style="italic">Instructing Machines · a machine you build in your head — read, write, move, change state, repeat</text>
</svg>