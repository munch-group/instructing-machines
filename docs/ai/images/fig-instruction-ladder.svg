<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="500" fill="#f6f4ef"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">Every step up trades control for closeness to human language</text>
  <text x="40" y="63" font-size="14" fill="#5a6675">Each layer is a <tspan font-weight="600" fill="#26313f">translator</tspan> down to the one below. Climb, and you say more with less — handing more of the "how" to the machine.</text>

  <!-- side axis arrows -->
  <text x="828" y="112" font-size="12" font-weight="700" fill="#6b46a6" text-anchor="end">↑ closer to</text>
  <text x="828" y="128" font-size="12" font-weight="700" fill="#6b46a6" text-anchor="end">human language</text>
  <text x="828" y="452" font-size="12" font-weight="700" fill="#3a4250" text-anchor="end">↓ closer to</text>
  <text x="828" y="468" font-size="12" font-weight="700" fill="#3a4250" text-anchor="end">the hardware</text>

  <!-- Rung 5: AI -->
  <g>
    <rect x="60" y="92" width="480" height="66" rx="11" fill="#f1ebf8" stroke="#d6c6ee"/>
    <rect x="60" y="92" width="6" height="66" rx="3" fill="#6b46a6"/>
    <text x="82" y="118" font-size="16" font-weight="700" fill="#6b46a6">🤖 Natural language, through an AI</text>
    <text x="82" y="140" font-size="13" fill="#7a5aa8">“Translate this DNA and count the codons.” — plain English, no syntax at all</text>
    <text x="528" y="130" font-size="12.5" fill="#6b46a6" text-anchor="end" font-style="italic">newest layer ⚠</text>
  </g>

  <!-- Rung 4: interpreted -->
  <g>
    <rect x="110" y="170" width="480" height="66" rx="11" fill="#e8f1fb" stroke="#bcd6f0"/>
    <rect x="110" y="170" width="6" height="66" rx="3" fill="#2f6db3"/>
    <text x="132" y="196" font-size="16" font-weight="700" fill="#2f6db3">🐍 Interpreted languages — Python</text>
    <text x="132" y="218" font-size="13" fill="#5a6675" font-family="monospace">print(sum(counts.values()))</text>
  </g>

  <!-- Rung 3: compiled -->
  <g>
    <rect x="160" y="248" width="480" height="66" rx="11" fill="#e6f3ef" stroke="#b6ddd2"/>
    <rect x="160" y="248" width="6" height="66" rx="3" fill="#1f7a68"/>
    <text x="182" y="274" font-size="16" font-weight="700" fill="#1f7a68">Compiled languages — C, Rust</text>
    <text x="182" y="296" font-size="13" fill="#5a6675">Readable words, but translated all at once into machine code before it runs</text>
  </g>

  <!-- Rung 2: assembly -->
  <g>
    <rect x="210" y="326" width="480" height="66" rx="11" fill="#eceef1" stroke="#cfd4db"/>
    <rect x="210" y="326" width="6" height="66" rx="3" fill="#3a4250"/>
    <text x="232" y="352" font-size="16" font-weight="700" fill="#3a4250">Assembly</text>
    <text x="232" y="374" font-size="13" fill="#5a6675" font-family="monospace">MOV AX, 4 &#160;&#160;ADD AX, BX &#160;&#160;— one word per machine step</text>
  </g>

  <!-- Rung 1: machine code -->
  <g>
    <rect x="260" y="404" width="480" height="66" rx="11" fill="#fbf1e2" stroke="#e9cfa5"/>
    <rect x="260" y="404" width="6" height="66" rx="3" fill="#b26a1f"/>
    <text x="282" y="430" font-size="16" font-weight="700" fill="#b26a1f">Machine code — what the CPU runs</text>
    <text x="282" y="452" font-size="13" fill="#5a6675" font-family="monospace">10111000 00000100 — pure bits, total control</text>
  </g>
</svg>
