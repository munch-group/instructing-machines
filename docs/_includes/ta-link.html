<script>
// The margin link to the other book ("TA version of this page" in the student
// book, "Student version of this page" in the TA one) is declared with a fixed
// href in _quarto-default.yml and _quarto-ta.yml, because Quarto resolves
// other-links from metadata before pandoc runs and has no way to express "this
// page, one directory over". So point it at the current page's counterpart here.
//
// document.baseURI rather than location.href: pagecrypt serves the decrypted TA
// page inside a srcdoc iframe, where location.href is "about:srcdoc" but baseURI
// is still inherited from the real page URL.
//
// The root is derived from the site_libs asset every page loads, rather than
// hard-coded, so this works in local preview, over file:// and on the published
// site alike. On a page carrying neither link the whole thing is a no-op.
document.addEventListener("DOMContentLoaded", function () {
  var asset = document.querySelector('script[src*="site_libs/"], link[href*="site_libs/"]');
  if (!asset) return;
  var url = asset.src || asset.href;                  // absolute, resolved against baseURI
  var root = url.slice(0, url.indexOf("site_libs/")); // absolute URL of this book's root
  var page = document.baseURI.slice(root.length);     // this page, relative to that root

  var toTa = document.querySelector('.quarto-other-links a[rel="ta-version"]');
  if (toTa) toTa.href = root + "ta/" + page;

  var toStudent = document.querySelector('.quarto-other-links a[rel="student-version"]');
  if (toStudent) toStudent.href = root.replace(/ta\/$/, "") + page;
});
</script>
