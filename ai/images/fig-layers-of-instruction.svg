<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- box 1: AI assistant -->
  <rect x="15" y="8" width="210" height="72" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="34" font-size="12" text-anchor="middle" fill="#111">
    <tspan x="120" dy="0">An AI assistant:</tspan>
    <tspan x="120" dy="16">a request in plain</tspan>
    <tspan x="120" dy="16">language</tspan>
  </text>

  <line x1="120" y1="80" x2="120" y2="122" stroke="#333" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="130" y="104" font-size="9.5" font-style="italic" fill="#555">translates down to</text>

  <!-- box 2: Python -->
  <rect x="15" y="126" width="210" height="54" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="150" font-size="12" text-anchor="middle" fill="#111">
    <tspan x="120" dy="0">Python: an</tspan>
    <tspan x="120" dy="16">interpreted language</tspan>
  </text>

  <line x1="120" y1="180" x2="120" y2="222" stroke="#333" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="130" y="204" font-size="9.5" font-style="italic" fill="#555">translates down to</text>

  <!-- box 3: C and other compiled languages -->
  <rect x="15" y="226" width="210" height="54" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="250" font-size="12" text-anchor="middle" fill="#111">
    <tspan x="120" dy="0">C and other</tspan>
    <tspan x="120" dy="16">compiled languages</tspan>
  </text>

  <line x1="120" y1="280" x2="120" y2="322" stroke="#333" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="130" y="304" font-size="9.5" font-style="italic" fill="#555">translates down to</text>

  <!-- box 4: Assembly -->
  <rect x="15" y="326" width="210" height="36" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="349" font-size="12" text-anchor="middle" fill="#111">Assembly</text>

  <line x1="120" y1="362" x2="120" y2="404" stroke="#333" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="130" y="386" font-size="9.5" font-style="italic" fill="#555">translates down to</text>

  <!-- box 5: Machine code -->
  <rect x="15" y="408" width="210" height="72" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="434" font-size="12" text-anchor="middle" fill="#111">
    <tspan x="120" dy="0">Machine code: the</tspan>
    <tspan x="120" dy="16">raw bits the CPU</tspan>
    <tspan x="120" dy="16">runs</tspan>
  </text>
</svg>
