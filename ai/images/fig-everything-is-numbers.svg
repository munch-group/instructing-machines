<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="340" fill="#f6f4ef"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#26313f">Underneath everything: just two symbols</text>
  <text x="40" y="66" font-size="14" fill="#5a6675">A switch is either off or on. Write that as 0 or 1 — one <tspan font-weight="600">bit</tspan>. Everything else is built on top.</text>

  <!-- switches -->
  <g>
    <rect x="40" y="96" width="200" height="120" rx="12" fill="#ffffff" stroke="#dfd9cf"/>
    <text x="140" y="120" font-size="11" font-weight="700" fill="#5a6675" text-anchor="middle" letter-spacing="1">TINY SWITCHES</text>
    <circle cx="80" cy="160" r="16" fill="#eceef1" stroke="#cfd4db"/>
    <text x="80" y="165" font-size="15" font-weight="700" fill="#3a4250" text-anchor="middle">0</text>
    <circle cx="120" cy="160" r="16" fill="#3a4250"/>
    <text x="120" y="165" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="160" cy="160" r="16" fill="#3a4250"/>
    <text x="160" y="165" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="200" cy="160" r="16" fill="#eceef1" stroke="#cfd4db"/>
    <text x="200" y="165" font-size="15" font-weight="700" fill="#3a4250" text-anchor="middle">0</text>
    <text x="140" y="200" font-size="12" fill="#5a6675" text-anchor="middle">off · on · on · off</text>
  </g>

  <text x="262" y="165" font-size="26" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- number -->
  <g>
    <rect x="292" y="96" width="180" height="120" rx="12" fill="#ffffff" stroke="#dfd9cf" stroke-width="1"/>
    <rect x="292" y="96" width="6" height="120" rx="3" fill="#2f6db3"/>
    <text x="384" y="120" font-size="11" font-weight="700" fill="#2f6db3" text-anchor="middle" letter-spacing="1">A NUMBER</text>
    <text x="384" y="168" font-size="34" font-weight="700" fill="#26313f" text-anchor="middle">01100100</text>
    <text x="384" y="196" font-size="13" fill="#5a6675" text-anchor="middle">8 bits = 1 byte = 100</text>
  </g>

  <text x="494" y="165" font-size="26" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- meanings -->
  <g>
    <rect x="524" y="96" width="316" height="120" rx="12" fill="#ffffff" stroke="#dfd9cf"/>
    <rect x="524" y="96" width="6" height="120" rx="3" fill="#1f7a68"/>
    <text x="682" y="120" font-size="11" font-weight="700" fill="#1f7a68" text-anchor="middle" letter-spacing="1">…AND WHATEVER WE AGREE IT MEANS</text>
    <text x="546" y="150" font-size="14" fill="#26313f">the number <tspan font-weight="700">100</tspan></text>
    <text x="546" y="174" font-size="14" fill="#26313f">the letter <tspan font-weight="700">'d'</tspan></text>
    <text x="546" y="198" font-size="14" fill="#26313f">a shade of <tspan font-weight="700">grey</tspan></text>
    <text x="704" y="150" font-size="14" fill="#26313f">part of a <tspan font-weight="700">DNA base</tspan></text>
    <text x="704" y="174" font-size="14" fill="#26313f">one dot of <tspan font-weight="700">sound</tspan></text>
    <text x="704" y="198" font-size="14" fill="#26313f">a step of a <tspan font-weight="700">program</tspan></text>
  </g>

  <text x="40" y="270" font-size="14" fill="#5a6675">The same eight switches can <tspan font-weight="600" fill="#26313f">mean</tspan> a number, a letter, a colour, or an instruction. The meaning comes from the</text>
  <text x="40" y="292" font-size="14" fill="#5a6675">program that reads them — not from the switches. Bits are dumb; the code that interprets them is where meaning lives.</text>
  <text x="40" y="322" font-size="12.5" fill="#8a93a0" font-style="italic">Instructing Machines · everything inside a computer is ultimately numbers made of bits</text>
</svg>
