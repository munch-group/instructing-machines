<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="440" fill="#f6f4ef"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">Why the AI is <tspan font-style="italic">not</tspan> just one more compiler</text>
  <text x="40" y="63" font-size="14" fill="#5a6675">Both turn a description into code. But they translate in two completely different ways — and that difference is the reason this course exists.</text>

  <!-- COMPILER/INTERPRETER -->
  <g>
    <rect x="40" y="88" width="390" height="292" rx="14" fill="#ffffff" stroke="#b6ddd2"/>
    <rect x="40" y="88" width="6" height="292" rx="3" fill="#1f7a68"/>
    <text x="64" y="116" font-size="16" font-weight="700" fill="#1f7a68">A compiler / interpreter</text>
    <text x="64" y="138" font-size="12.5" fill="#5a6675" font-style="italic">a deterministic, meaning-preserving translator</text>

    <g font-size="13.5" fill="#26313f">
      <circle cx="76" cy="168" r="4" fill="#1f7a68"/>
      <text x="90" y="173">Same input <tspan font-weight="600">always</tspan> gives the same output.</text>
      <circle cx="76" cy="204" r="4" fill="#1f7a68"/>
      <text x="90" y="209">The output means <tspan font-weight="600">exactly</tspan> what the input said.</text>
      <circle cx="76" cy="240" r="4" fill="#1f7a68"/>
      <text x="90" y="245">Follows fixed rules a person wrote down.</text>
      <circle cx="76" cy="276" r="4" fill="#1f7a68"/>
      <text x="90" y="281">Wrong only if it has an outright bug.</text>
    </g>

    <rect x="64" y="304" width="342" height="56" rx="10" fill="#e6f3ef" stroke="#b6ddd2"/>
    <text x="235" y="330" font-size="16" font-weight="700" fill="#1f7a68" text-anchor="middle">➜ You can TRUST it</text>
    <text x="235" y="350" font-size="12.5" fill="#5a6675" text-anchor="middle">— without ever reading the machine code it makes.</text>
  </g>

  <!-- AI -->
  <g>
    <rect x="450" y="88" width="390" height="292" rx="14" fill="#ffffff" stroke="#d6c6ee"/>
    <rect x="450" y="88" width="6" height="292" rx="3" fill="#6b46a6"/>
    <text x="474" y="116" font-size="16" font-weight="700" fill="#6b46a6">🤖 An AI</text>
    <text x="474" y="138" font-size="12.5" fill="#5a6675" font-style="italic">a probabilistic, meaning-approximating translator</text>

    <g font-size="13.5" fill="#26313f">
      <circle cx="486" cy="168" r="4" fill="#6b46a6"/>
      <text x="500" y="173">Same prompt can give <tspan font-weight="600">different</tspan> code.</text>
      <circle cx="486" cy="204" r="4" fill="#6b46a6"/>
      <text x="500" y="209">The code <tspan font-weight="600">may not</tspan> mean what you asked.</text>
      <circle cx="486" cy="240" r="4" fill="#6b46a6"/>
      <text x="500" y="245">Follows patterns it absorbed, not fixed rules.</text>
      <circle cx="486" cy="276" r="4" fill="#6b46a6"/>
      <text x="500" y="281">Can be fluent, plausible, and simply wrong.</text>
    </g>

    <rect x="474" y="304" width="342" height="56" rx="10" fill="#f1ebf8" stroke="#d6c6ee"/>
    <text x="645" y="330" font-size="16" font-weight="700" fill="#6b46a6" text-anchor="middle">➜ You must VERIFY it</text>
    <text x="645" y="350" font-size="12.5" fill="#5a6675" text-anchor="middle">— by reading the Python and running the machine.</text>
  </g>

  <!-- bottom line -->
  <rect x="40" y="396" width="800" height="30" rx="8" fill="#26313f"/>
  <text x="440" y="416" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">You trust a compiler. You verify an AI. Understanding Python is exactly what lets you verify.</text>
</svg>
