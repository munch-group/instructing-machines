[workspace]
authors = ["Kasper Munch <kaspermunch@birc.au.dk>"]
channels = ["conda-forge", "munch-group"]
name = "instructing-machines"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Re-solve the student environment for all four platforms. Run this after
# editing student-folder/pixi.toml, then commit the lock file. Then build 
# the downloadable zip by hand.
student-folder = "pixi lock --manifest-path student-folder/pixi.toml && python3 scripts/build_student_folder.py"
# Execute every notebook the book renders, verify none of them raise, then
# strip their output — run this after editing any notebook, before
# committing. Quarto itself never executes (execute: enabled: false in
# docs/_quarto.yml), so this is the only place a broken cell gets caught.
clean-notebooks = "python3 scripts/clean_notebooks.py"
# Point git at scripts/hooks, whose pre-commit hook does the fast half of
# clean-notebooks — kernel metadata and output stripping — on the notebooks in
# a commit, so neither can reach CI. Run once per clone; core.hooksPath is
# local config and is not cloned with the repository.
install-hooks = "git config core.hooksPath scripts/hooks"
# Convenience wrapper: repairs the docs/jupyterlite pixi env if this repo
# was moved/cloned to a new path and its baked-in interpreter paths went
# stale. build-demo.sh's pixi tasks already run this automatically; this
# is for running it by hand.
jupyterlite-doctor = "pixi run --manifest-path docs/jupyterlite/pixi.toml doctor"
# Run project tests against the solutions for each project.
test-projects = "pytest-check --sweep project-files/"

[tasks.todo]
# Defaults match the old `prompts` task's behaviour (CLAUDE: only, strict):
# `pixi run todo` alone is unchanged. Pass `--todo "--todo"` to also collect
# TODO:/FIXME:, or `--claude ""` to turn CLAUDE: off and get TODO:/FIXME: only.
args = [
  { "arg" = "claude", "default" = "" },
  { "arg" = "todo", "default" = "" },
  { "arg" = "match", "default" = "" },
]
cmd = "python scripts/todo.py --strict {{ claude }} {{ todo }} {{ match }}"

[tasks.preview]
cmd = "cd docs && quarto render --profile preview && open _book/index.html"

# [tasks.smoketest]
# cmd = "./scripts/vscode_kernel_smoketest.sh"


