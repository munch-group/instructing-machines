[workspace]
authors = ["Kasper Munch <kaspermunch@birc.au.dk>"]
channels = ["conda-forge", "munch-group"]
name = "instructing-machines"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Re-solve the student environment for all four platforms. Run this after
# editing student-folder/pixi.toml, then commit the lock file.
student-lock = "pixi lock --manifest-path student-folder/pixi.toml"
# Build the downloadable zip by hand (Quarto does it on every render).
student-zip = "python3 scripts/build_student_folder.py"

# Convenience wrapper: repairs the docs/jupyterlite pixi env if this repo
# was moved/cloned to a new path and its baked-in interpreter paths went
# stale. build-demo.sh's pixi tasks already run this automatically; this
# is for running it by hand.
jupyterlite-doctor = "pixi run --manifest-path docs/jupyterlite/pixi.toml doctor"

[dependencies]
jupyter = ">=1.1.1,<2"
nodejs = ">=26.5.1,<26.6"
nbconvert = ">=7.17.1,<8"
quarto = ">=1.9.38,<2"
ipython = ">=9.15.0,<10"
ipykernel = ">=7.3.0,<8"
nbdime = ">=4.0.4,<5"
seaborn = ">=0.13.2,<0.14"
steps-widget = ">=0.2.9,<0.3"
puzzle-widget = ">=0.1.18,<0.2"
turtle-widget = ">=1.0.5,<2"
codelens-widget = ">=0.1.42,<0.2"
snippet-cast = ">=0.1.49,<0.2"
pytest = ">=9.1.1,<10"
cryptography = ">=50.0.0,<51"
anywidget = ">=0.11.0,<0.12"
sandbox-widget = ">=1.0.7,<2"
im-pytest = ">=0.1.29,<0.2"
iplot-widget = ">=0.1.18,<0.2"
vscodenb = ">=1.0.1,<2"
deno = ">=2.4.5,<2.5"
cairosvg = ">=2.9.0,<3"
fonttools = ">=4.63.0,<5"
librsvg = ">=2.62.3,<3"
