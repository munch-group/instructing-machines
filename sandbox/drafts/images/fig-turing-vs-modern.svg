<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="880" height="440" fill="#f6f4ef"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">Turing’s imagined machine vs. the chips in your laptop</text>
<text x="40" y="63" font-size="14" fill="#5a6675">Same deep idea, very different bodies. The shared part is why your laptop can run <tspan font-style="italic">any</tspan> program at all.</text>
<rect x="40" y="80" width="800" height="98" rx="12" fill="#26313f"/>
<text x="60" y="104" font-size="12.5" font-weight="700" fill="#c9d2dc" letter-spacing="0.5">WHAT THEY SHARE</text>
<text x="60" y="128" font-size="13.5" fill="#ffffff">• Follow a fixed set of rules, <tspan font-weight="700">one tiny step at a time</tspan>, over stored symbols.</text>
<text x="60" y="150" font-size="13.5" fill="#ffffff">• Keep the <tspan font-weight="700">storage</tspan> (tape / memory) separate from the <tspan font-weight="700">worker</tspan> (head / CPU).</text>
<text x="60" y="172" font-size="13.5" fill="#ffffff">• One <tspan font-weight="700">universal</tspan> machine can act out any program written on its tape — the idea behind a general-purpose computer.</text>
<rect x="40" y="196" width="390" height="214" rx="14" fill="#ffffff" stroke="#cfd4db"/>
<rect x="40" y="196" width="6" height="214" rx="3" fill="#3a4250"/>
<text x="64" y="224" font-size="16" font-weight="700" fill="#3a4250">Turing machine</text>
<text x="64" y="244" font-size="12.5" fill="#5a6675" font-style="italic">imagined on paper, 1936</text>
<text x="64" y="274" font-size="13" font-weight="700" fill="#3a4250">Made of</text>
<text x="64" y="292" font-size="12.5" fill="#26313f">imagination — a thought experiment, not built for real work</text>
<text x="64" y="318" font-size="13" font-weight="700" fill="#3a4250">Storage</text>
<text x="64" y="336" font-size="12.5" fill="#26313f">an endless tape, infinitely long</text>
<text x="64" y="362" font-size="13" font-weight="700" fill="#3a4250">Reaching a spot</text>
<text x="64" y="380" font-size="12.5" fill="#26313f">shuffle the head left/right, square by square</text>
<text x="64" y="406" font-size="13" font-weight="700" fill="#3a4250">Speed</text>
<text x="64" y="424" font-size="12.5" fill="#26313f">one symbol at a time — glacial by hand</text>
<rect x="450" y="196" width="390" height="214" rx="14" fill="#ffffff" stroke="#e9cfa5"/>
<rect x="450" y="196" width="6" height="214" rx="3" fill="#b26a1f"/>
<text x="474" y="224" font-size="16" font-weight="700" fill="#b26a1f">Your chip computer</text>
<text x="474" y="244" font-size="12.5" fill="#5a6675" font-style="italic">built from transistors, today</text>
<text x="474" y="274" font-size="13" font-weight="700" fill="#b26a1f">Made of</text>
<text x="474" y="292" font-size="12.5" fill="#26313f">millions of real transistors — the on/off switches from earlier</text>
<text x="474" y="318" font-size="13" font-weight="700" fill="#b26a1f">Storage</text>
<text x="474" y="336" font-size="12.5" fill="#26313f">finite memory — enormous, but not endless</text>
<text x="474" y="362" font-size="13" font-weight="700" fill="#b26a1f">Reaching a spot</text>
<text x="474" y="380" font-size="12.5" fill="#26313f">jumps to any address at once — the “random access” in RAM</text>
<text x="474" y="406" font-size="13" font-weight="700" fill="#b26a1f">Speed</text>
<text x="474" y="424" font-size="12.5" fill="#26313f">billions of steps every second, electronically</text>
<text x="40" y="446" font-size="12.5" fill="#8a93a0" font-style="italic">Instructing Machines · the tape became memory, the head became the CPU, the rule table became your program</text>
</svg>