<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="440" fill="#f6f4ef"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#26313f">Underneath, the AI does one thing: guess the next word</text>
  <text x="40" y="63" font-size="14" fill="#5a6675">It reads everything so far, scores every possible next <tspan font-weight="600" fill="#6b46a6">token</tspan> (a word or word-piece), picks one, adds it, and repeats.</text>

  <!-- so far -->
  <text x="40" y="104" font-size="12" font-weight="700" fill="#5a6675" letter-spacing="0.5">WHAT IT HAS SEEN SO FAR</text>
  <rect x="40" y="116" width="560" height="46" rx="10" fill="#ffffff" stroke="#dfd9cf"/>
  <text x="58" y="145" font-size="15" fill="#26313f">The stop codon in this sequence is</text>
  <rect x="368" y="126" width="26" height="26" rx="5" fill="#f1ebf8" stroke="#d6c6ee"/>
  <text x="381" y="145" font-size="15" fill="#6b46a6" text-anchor="middle">?</text>

  <text x="620" y="144" font-size="24" fill="#b9b1a3" text-anchor="middle">→</text>

  <!-- model -->
  <rect x="656" y="112" width="184" height="54" rx="12" fill="#f1ebf8" stroke="#d6c6ee"/>
  <rect x="656" y="112" width="6" height="54" rx="3" fill="#6b46a6"/>
  <text x="750" y="136" font-size="14" font-weight="700" fill="#6b46a6" text-anchor="middle">🤖 the model</text>
  <text x="750" y="155" font-size="11.5" fill="#7a5aa8" text-anchor="middle">scores every next word</text>

  <!-- distribution -->
  <text x="40" y="204" font-size="12" font-weight="700" fill="#5a6675" letter-spacing="0.5">HOW LIKELY IT THINKS EACH NEXT WORD IS</text>

  <!-- bars -->
  <g font-size="13">
    <text x="150" y="234" fill="#26313f" text-anchor="end" font-family="monospace">TAG</text>
    <rect x="162" y="222" width="300" height="18" rx="4" fill="#6b46a6"/>
    <text x="472" y="236" fill="#6b46a6" font-weight="700">61%</text>

    <text x="150" y="262" fill="#26313f" text-anchor="end" font-family="monospace">TAA</text>
    <rect x="162" y="250" width="120" height="18" rx="4" fill="#8b6bc0"/>
    <text x="292" y="264" fill="#7a5aa8" font-weight="600">24%</text>

    <text x="150" y="290" fill="#26313f" text-anchor="end" font-family="monospace">TGA</text>
    <rect x="162" y="278" width="55" height="18" rx="4" fill="#b3a0d6"/>
    <text x="227" y="292" fill="#8a7bb0" font-weight="600">11%</text>

    <text x="150" y="318" fill="#26313f" text-anchor="end" font-family="monospace">banana</text>
    <rect x="162" y="306" width="10" height="18" rx="4" fill="#d6c6ee"/>
    <text x="182" y="320" fill="#a99ac6">0.2%</text>
  </g>

  <!-- pick -->
  <text x="540" y="270" font-size="16" fill="#b9b1a3" text-anchor="middle">→ pick →</text>
  <rect x="614" y="246" width="226" height="46" rx="10" fill="#e6f3ef" stroke="#b6ddd2"/>
  <text x="727" y="268" font-size="14" fill="#26313f" text-anchor="middle">…the codon is <tspan font-weight="700" font-family="monospace">TAG</tspan></text>
  <text x="727" y="285" font-size="11.5" fill="#1f7a68" text-anchor="middle">that word is now part of the text</text>

  <!-- loop arrow -->
  <path d="M 730 296 L 730 330 L 300 330 L 300 348" fill="none" stroke="#c9a0e0" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 300 348 l -5 -8 l 10 0 z" fill="#c9a0e0"/>
  <text x="515" y="325" font-size="12.5" fill="#6b46a6" text-anchor="middle" font-weight="600">…then do it all again for the word after that ↺</text>

  <!-- caution -->
  <rect x="40" y="360" width="800" height="60" rx="12" fill="#fbf1e2" stroke="#e9cfa5"/>
  <text x="60" y="384" font-size="13.5" fill="#26313f"><tspan font-weight="700" fill="#b26a1f">Notice:</tspan> it chose <tspan font-family="monospace">TAG</tspan> because that word <tspan font-style="italic">usually follows</tspan> in text it has seen — not because it checked your actual sequence.</text>
  <text x="60" y="405" font-size="13.5" fill="#26313f">It is producing a <tspan font-weight="600">plausible</tspan> continuation, which is often right and sometimes confidently wrong. That gap is the whole point of Part 2.</text>
</svg>
