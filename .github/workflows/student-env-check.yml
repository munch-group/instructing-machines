name: Student environment check

# Does the environment we hand to 100 students actually install on the machines
# they own? This is the check that would have caught last year's Windows
# trouble before the students did.
#
# It is deliberately cheap to run and safe to leave failing: it publishes
# nothing. Until the widget conda recipes are rebuilt as `noarch: python`,
# expect the Windows and Intel-Mac jobs to be the interesting ones.

on:
  workflow_dispatch:
  push:
    paths:
      - "student-folder/**"
      - "scripts/build_student_folder.py"
      - "scripts/check_env_kernel.py"
      - "scripts/check_notebook_kernels.py"
      - ".github/workflows/student-env-check.yml"

jobs:
  install:
    name: Install on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows }
          - { os: macos-13, label: Intel Mac }
          - { os: macos-latest, label: Apple Silicon Mac }
          - { os: ubuntu-latest, label: Linux }
    steps:
      - uses: actions/checkout@v4

      # `locked: true` means the committed pixi.lock must already cover this
      # platform. If it does not, the job fails here — which is exactly the
      # signal we want, because a student on this platform would fail too.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: student-folder/pixi.toml
          locked: true

      - name: Import every course package, and register the kernel
        # `check` depends on the `kernel` task, so this is also the step
        # that registers the course kernelspec — exactly as it is on a
        # student's machine, where `pixi run check` is the day-one command.
        # The check below then confirms it landed.
        run: pixi run --manifest-path student-folder/pixi.toml check

      # Installing the packages is not the same as being able to open a
      # notebook. The course registers no kernel of its own, so the only
      # one a student gets is what ipykernel writes into the environment
      # prefix — and whether it lands, and points at this environment, is
      # exactly the kind of thing that works on one platform and not
      # another.
      - name: The environment exposes a notebook kernel
        run: pixi run --manifest-path student-folder/pixi.toml python scripts/check_env_kernel.py

  package:
    name: Build the download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Notebook kernel metadata is neutral
        # The zip carries two notebooks and the site publishes the rest
        # for `im get`. All of them are opened on a machine that has
        # never run them, so none may name a kernel only ours has.
        run: python3 scripts/check_notebook_kernels.py

      - name: Assemble the student folder
        run: python3 scripts/build_student_folder.py --out _check

      - name: Show what students will get
        run: |
          unzip -l _check/instructing-machines.zip
          test -f _check/pixi.toml
          test -f _check/pixi.lock

      # The projects are fetched one per week rather than shipped on day one,
      # so the zips and the manifest `pixi run get` reads are part of what
      # a publish has to produce.
      - name: Show the projects students can fetch
        run: |
          ls -l _check/project-files/
          cat _check/project-files/index.txt
          test -s _check/project-files/index.txt
          for zip in _check/project-files/*.zip; do
            if unzip -l "$zip" | grep -q "_solution"; then
              echo "A solution file leaked into $zip"
              exit 1
            fi
          done

      # Handy when something looks wrong: download the artifact and unzip it
      # yourself instead of guessing.
      - uses: actions/upload-artifact@v4
        with:
          name: student-folder
          path: _check/instructing-machines.zip
