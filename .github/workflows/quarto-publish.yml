on:
  push:
    branches:
      - main

name: Render and Publish

# you need these permissions to publish to GitHub pages
permissions: 
    contents: write
    pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up pixi and the course environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Build the book with the same environment the students install, so
          # a chapter that renders here is a chapter that runs on their laptop.
          # student-folder/pixi.toml is the one that is cross-platform and has
          # the course widgets; the root pixi.toml is Mac-only (osx-arm64).
          manifest-path: student-folder/pixi.toml
          run-install: true
          # Put that environment on PATH for the steps below, so Quarto's
          # jupyter engine executes the notebooks with the course Python
          # rather than with whatever python the runner happens to ship.
          activate-environment: true

      - name: Check the course environment
        # A wrong or half-installed environment otherwise shows up much later
        # as a confusing ImportError in the middle of a chapter.
        run: |
          which python
          python -c "import sys, steps_widget, puzzle_widget, codelens_widget, turtle_widget, sandbox_widget, iplot_widget, im_pytest, pandas, seaborn; print('Everything is installed. Python', sys.version.split()[0])"
          jupyter --version

      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     packages: |
      #       any::downloadthis
      #     # extra-packages: |
      #     #   any::downloadthis

      - name: Check the AI role ladder
        # The course licenses the assistant in five escalating roles, and no
        # exercise may license a role before the chapter that teaches it.
        # This walks _quarto.yml in render order and fails on the first badge
        # that arrives too early, so the ladder cannot silently bend again.
        run: python3 scripts/check-badge-order.py --census

      - name: Execute and verify every notebook
        # Quarto never executes at render time (execute: enabled: false in
        # docs/_quarto.yml) — the website and the download are meant to show
        # the same unexecuted notebook a student opens, not one with the
        # answer already sitting in an output cell. This is therefore the
        # only place a broken cell gets caught before publish. It also
        # re-strips output/widget-state metadata, so a contributor who forgot
        # to run `pixi run clean-notebooks` locally doesn't publish a diff
        # with baked-in answers — though the fix belongs in their commit, not
        # in this CI run, since nothing here gets committed back.
        run: python3 scripts/clean_notebooks.py

      - name: Install rsvg-convert
        # The book's figures include SVGs (docs/ai/images/fig-*.svg), and the
        # PDF book embeds them by rasterizing through rsvg-convert. TinyTeX
        # manages TeX packages, not general system binaries, so it does not
        # provide this; without it the PDF build fails with "Could not
        # convert a SVG to a PDF for output" during `quarto publish` below,
        # which renders every format in docs/_quarto.yml, not just HTML.
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book
          tinytex: true
          # uncomment below and fill to pin a version
          # version: SPECIFIC-QUARTO-VERSION-HERE

      - name: Render Quarto Project - default profile
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: default
        with:
          path: docs
          to: html

      # - name: Render Quarto Project - draft profile
      #   uses: quarto-dev/quarto-actions/render@v2
      #   env:
      #     QUARTO_PROFILE: slides
      #   with:
      #     path: .
      #     to: html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

    permissions:
      contents: write        
#     pages: write
